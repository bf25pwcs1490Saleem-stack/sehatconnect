{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<h1>Admin Login</h1>

<div class="login-info">
  <p><strong>Team Members:</strong> Use your assigned username and password.</p>
  <p><strong>Default accounts:</strong> admin, member1, member2, member3</p>
</div>

<form method="POST" class="form-card narrow">

  <label>Username
    <input type="text" name="username" required autofocus
           placeholder="e.g. admin or member1"
           autocomplete="username">
  </label>

  <label>Password
    <input type="password" name="password" required
           placeholder="Enter your password"
           autocomplete="current-password">
  </label>

  <button type="submit" class="btn btn-primary">Login</button>
</form>
{% endblock %}
